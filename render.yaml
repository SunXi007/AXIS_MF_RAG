# Render Blueprint for the Axis MF RAG chatbot.
#
# Root Directory is deliberately omitted. Render defaults it to the repo root,
# which is required: every path in config.py resolves from ROOT_DIR, and the
# build runs `python -m src.ingest`. Setting rootDir to `src` makes that module
# unimportable and fails the build with "No module named src.ingest".
#
# `--workers 1` is required, not a default: each worker would load its own copy
# of MiniLM, and on a 512 MB instance two workers exhaust memory immediately.
# Session memory lives in the worker process, so more than one worker would also
# split a browser session across processes and break follow-up resolution.

services:
  - type: web
    name: axis-mf-rag
    runtime: python

    # Free tier: $0, 512 MB RAM, 0.1 CPU. The risk is the build, not the bill:
    # python -m src.ingest holds torch plus MiniLM in memory while embedding 5,415
    # chunks, and 512 MB is tight. If the build is OOM-killed, Render reports only
    # "Build failed" with no traceback. Fixing it means plan: starter ($7/mo, 512 MB,
    # 0.5 CPU) or a prebuilt committed index. The env vars below narrow the
    # processes so the free tier has the best chance of succeeding.
    plan: free

    buildCommand: >-
      pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
      && pip install -r requirements.txt
      && python -m src.ingest
    # `python -m uvicorn`, not a bare `uvicorn`. The bare console script depends on
    # the venv's bin/ being on PATH, and a build cached from before the FastAPI
    # migration (Streamlit era, no uvicorn in requirements.txt) yields exactly
    # "bash: line 1: uvicorn: command not found" at runtime. Invoking the module
    # runs it from the interpreter Render already launched, so it cannot be lost
    # from PATH, and it fails loudly with a real traceback if uvicorn is absent.
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      # cp312 matches the manylinux wheels in the build log.
      - key: PYTHON_VERSION
        value: 3.12.8

      # Keep native maths and tokenizers single-threaded. Every thread reserves
      # its own stack and arena, so this is the cheapest way to cut peak RSS on a
      # 512 MB instance during the embed pass.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

      # 5,415 chunks are embedded one batch at a time, so peak memory tracks this
      # value. Dropped from the config.py default of 32 for the free tier only.
      - key: AXIS_EMBED_BATCH_SIZE
        value: "8"

      # llama-3.1-8b-instant, named in docs/implementation.md, is retired from
      # the Groq catalogue and 404s. gpt-oss-20b is the working substitute.
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      # sync: false prompts for the value in the Render dashboard and keeps it
      # out of this file. Do not put the key in here.
      - key: GROQ_API_KEY
        sync: false

      # Left at config.py defaults on purpose; uncomment to override.
      # - key: AXIS_TOP_K
      #   value: "12"
      # - key: AXIS_SIMILARITY_THRESHOLD
      #   value: "0.53"
      # - key: AXIS_MEMORY_MAX_MESSAGES
      #   value: "10"